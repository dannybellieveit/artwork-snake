<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Playlist</title>

  <meta property="og:title" content="Danny Casio">
  <meta property="og:description" content="Listen to the tracks">
  <meta property="og:type" content="website">

  <base href="/" />
  <link rel="stylesheet" href="/style.css">
  <style>
  :root{
    --bg      : #87CEEB;
    --card-bg : #ffffff;
    --btn     : #5AB4E5;
    --btn-dk  : #3F93C8;
    --player-bg     : rgba(20,22,26,0.72);
    --player-fg     : #fff;
    --player-fg-dim : rgba(255,255,255,0.65);
  }

  html,body{
    margin:0;
    background:var(--bg);
    color:#000;
  }

  #playlist-app{
    max-width:900px;
    width:min(100%,92vw);
    margin:0 auto;
    padding:2.5rem 0 1.5rem;
  }

  #playlist-state{
    text-align:center;
    padding:3rem 1rem;
    font-size:1.05rem;
  }

  /* header: cover art + title/byline */
  .pl-header{
    display:flex;
    gap:1.75rem;
    align-items:flex-end;
    margin-bottom:2rem;
  }

  .pl-cover{
    width:180px;
    height:180px;
    flex:none;
    border-radius:12px;
    box-shadow:0 4px 14px rgba(0,0,0,0.15);
    background-size:cover;
    background-position:center;
    overflow:hidden;
  }

  .pl-title-block h1{
    margin:0 0 .3rem;
    font-size:clamp(1.4rem,4vw,2rem);
    font-weight:700;
  }

  .pl-title-block p{
    margin:0;
    opacity:.75;
    font-size:.95rem;
  }

  /* track list */
  .pl-tracks{
    list-style:none;
    margin:0;
    padding:0;
    background:var(--card-bg);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
  }

  .pl-track{
    display:flex;
    align-items:center;
    gap:1rem;
    padding:.85rem 1.2rem;
    cursor:pointer;
    border-bottom:1px solid rgba(0,0,0,0.06);
    transition:background .12s ease;
  }

  .pl-track:last-child{ border-bottom:none; }
  .pl-track:focus-visible{ background:rgba(90,180,229,0.12); outline:none; }
  .pl-track.playing{ background:rgba(90,180,229,0.18); }

  /* Only apply hover tint on devices with a real pointer — touch devices
     can't un-hover after a tap, so it otherwise sticks on the last-tapped
     row forever, alongside whichever row is actually playing. */
  @media (hover: hover) and (pointer: fine) {
    .pl-track:hover{ background:rgba(90,180,229,0.12); outline:none; }
  }

  .pl-track-index{
    width:1.6rem;
    text-align:center;
    font-variant-numeric:tabular-nums;
    opacity:.6;
    flex:none;
  }

  .pl-track-playing-icon{
    display:none;
    width:1.6rem;
    text-align:center;
    flex:none;
    color:var(--btn-dk);
  }

  .pl-track.playing .pl-track-index{ display:none; }
  .pl-track.playing .pl-track-playing-icon{ display:inline-block; }

  .pl-track-name{
    flex:1;
    min-width:0;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .pl-track-duration{
    flex:none;
    font-size:.85rem;
    font-variant-numeric:tabular-nums;
    opacity:.6;
  }

  .pl-track-download{
    flex:none;
    display:flex;
    text-decoration:none;
    color:var(--font-color-dark);
    opacity:.6;
    padding:.2rem;
  }

  .pl-track-download svg{
    width:1rem;
    height:1rem;
    display:block;
    fill:currentColor;
  }

  .pl-track-download:hover{ opacity:1; }

  .pl-download-all{
    display:inline-block;
    margin-top:.5rem;
    font-size:.85rem;
    font-weight:600;
    color:var(--btn-dk);
    text-decoration:none;
  }

  .pl-download-all:hover{ text-decoration:underline; }

  /* sticky player bar */
  #pl-player{
    position:fixed;
    left:0; right:0; bottom:0;
    display:none;
    align-items:center;
    gap:1rem;
    padding:.9rem 1.4rem;
    padding-bottom:calc(.9rem + env(safe-area-inset-bottom, 0px));
    background:var(--player-bg);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    backdrop-filter:blur(16px) saturate(160%);
    border-top:1px solid rgba(255,255,255,0.08);
    box-shadow:0 -4px 24px rgba(0,0,0,0.35);
    min-width:0;
  }

  #pl-player.visible{ display:flex; }

  .pl-player-art{
    width:60px;
    height:60px;
    flex:none;
    border-radius:8px;
    background-size:cover;
    background-position:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.4);
  }

  .pl-player-meta{
    flex:none;
    width:min(28vw,220px);
    min-width:0;
  }

  .pl-player-meta .name{
    font-weight:600;
    font-size:.9rem;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    color:var(--player-fg);
  }

  .pl-player-controls{
    flex:none;
    display:flex;
    align-items:center;
    gap:.6rem;
  }

  .pl-player-controls button{
    background:none;
    border:none;
    cursor:pointer;
    line-height:1;
    padding:.3rem;
    color:var(--player-fg);
  }

  .pl-player-controls button svg{
    width:1.1rem;
    height:1.1rem;
    display:block;
    fill:currentColor;
  }

  .pl-player-controls .play-btn{
    width:2.2rem;
    height:2.2rem;
    border-radius:50%;
    background:var(--btn);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .pl-player-controls .play-btn svg{
    width:1rem;
    height:1rem;
  }

  .pl-player-controls .play-btn:hover{ background:var(--btn-dk); }

  #pl-play .icon-pause{ display:none; }
  #pl-play[data-playing="true"] .icon-play{ display:none; }
  #pl-play[data-playing="true"] .icon-pause{ display:block; }

  .pl-player-scrub{
    flex:1;
    display:flex;
    align-items:center;
    gap:.6rem;
    min-width:0;
  }

  .pl-waveform{
    flex:1;
    min-width:0;
    height:40px;
    cursor:pointer;
  }

  .pl-player-scrub .time{
    font-size:.8rem;
    font-variant-numeric:tabular-nums;
    color:var(--player-fg-dim);
    flex:none;
  }

  @media(max-width:640px){
    .pl-header{ flex-direction:column; align-items:center; text-align:center; }
    .pl-cover{ width:140px; height:140px; }
    .pl-player-meta{ display:none; }
    #pl-player{ gap:.5rem; padding-left:.8rem; padding-right:.8rem; }
    .pl-player-controls{ gap:.3rem; }
    .pl-player-scrub{ gap:.4rem; }
    .pl-player-scrub .time{ font-size:.72rem; }
  }

  #playlist-footer{
    padding:0 0 8rem;
    text-align:center;
  }

  /* Footer nav dropdowns (self-contained: not shared with other pages yet) */
  .nav-dropdown{ position:relative; }
  .nav-dropdown summary{
    cursor:pointer;
    font-weight:bold;
    color:var(--font-color-dark);
    list-style:none;
  }
  .nav-dropdown summary::-webkit-details-marker{ display:none; }
  /* Safari 15.4+ dropped ::-webkit-details-marker for the standard ::marker */
  .nav-dropdown summary::marker{ content:""; display:none; }
  .nav-dropdown summary:focus{
    outline:2px solid var(--font-color-dark);
    outline-offset:4px;
  }
  .nav-dropdown-menu{
    position:absolute;
    top:auto;
    bottom:calc(100% + var(--gap-small, 8px));
    left:50%;
    transform:translateX(-50%);
    list-style:none;
    margin:0;
    padding:var(--gap-small, 8px);
    background:#fff;
    border:1px solid var(--border-color, #000);
    border-radius:var(--border-radius);
    display:flex;
    flex-direction:column;
    gap:var(--gap-small, 8px);
    white-space:nowrap;
  }
  @media (hover: hover) and (pointer: fine) {
    .nav-dropdown summary{ pointer-events:none; }
    .nav-dropdown{ pointer-events:auto; }
    .nav-dropdown-menu a{ pointer-events:auto; }
  }
  </style>
</head>
<body>

  <div id="playlist-app">
    <div id="playlist-state">Loading…</div>
  </div>

  <footer id="playlist-footer">
    <ul class="contacts" style="justify-content:center;">
      <li><a href="/index.html" aria-label="Home">Home</a></li>
      <li>
        <details class="nav-dropdown">
          <summary>Contact</summary>
          <ul class="nav-dropdown-menu">
            <li><a href="mailto:info@dannycasio.com" aria-label="Email Danny Casio">Email</a></li>
            <li><a href="https://instagram.com/dannycasio_/" target="_blank" rel="noopener" aria-label="Visit Danny Casio's Instagram">Instagram</a></li>
          </ul>
        </details>
      </li>
      <li>
        <details class="nav-dropdown">
          <summary>Other</summary>
          <ul class="nav-dropdown-menu">
            <li><a href="/discography.html">Discography</a></li>
          </ul>
        </details>
      </li>
    </ul>
  </footer>

  <div id="pl-player">
    <div class="pl-player-art" id="pl-player-art"></div>
    <div class="pl-player-meta">
      <div class="name" id="pl-player-name">—</div>
    </div>
    <div class="pl-player-controls">
      <button id="pl-prev" aria-label="Previous track">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"/></svg>
      </button>
      <button id="pl-play" class="play-btn" aria-label="Play" data-playing="false">
        <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button id="pl-next" aria-label="Next track">
        <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg>
      </button>
    </div>
    <div class="pl-player-scrub">
      <span class="time" id="pl-time-current">0:00</span>
      <div class="pl-waveform" id="pl-waveform"></div>
      <span class="time" id="pl-time-total">0:00</span>
    </div>
  </div>

  <audio id="pl-audio" preload="metadata"></audio>

  <script>
    // Desktop with a real mouse: open/close footer dropdowns on hover.
    // Touch devices (no hover) keep the native tap-to-toggle <details>
    // behaviour — but native <details> doesn't close its siblings on its
    // own, so two could end up open (and overlapping) at once on mobile.
    // The 'toggle' event fires for both hover-driven and tap-driven opens,
    // so closing siblings there covers both input types with one listener.
    (function () {
      var hoverQuery = window.matchMedia('(hover: hover) and (pointer: fine)');
      var dropdowns = document.querySelectorAll('.nav-dropdown');
      var closeTimers = new Map();

      dropdowns.forEach(function (dropdown) {
        dropdown.addEventListener('toggle', function () {
          if (!dropdown.open) return;
          dropdowns.forEach(function (other) {
            if (other !== dropdown) other.open = false;
          });
        });

        dropdown.addEventListener('mouseenter', function () {
          if (!hoverQuery.matches) return;
          clearTimeout(closeTimers.get(dropdown));
          dropdown.open = true;
        });
        dropdown.addEventListener('mouseleave', function () {
          if (!hoverQuery.matches) return;
          closeTimers.set(dropdown, setTimeout(function () {
            dropdown.open = false;
          }, 250));
        });
      });

      // Browser back/forward restores the page from bfcache exactly as
      // you left it, open dropdowns included. Force them shut on that restore.
      window.addEventListener('pageshow', function (e) {
        if (!e.persisted) return;
        dropdowns.forEach(function (dropdown) { dropdown.open = false; });
      });
    })();
  </script>
  <script src="https://unpkg.com/wavesurfer.js@7.9.9/dist/wavesurfer.min.js" defer></script>
  <script src="/playlist.js" defer></script>
</body>
</html>
